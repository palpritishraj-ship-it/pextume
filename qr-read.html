             <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <script>
        let videoStream = null;
        let animationFrameId = null;
        let scannedData = "";
        let rawDataForClipboard = ""; 
        let isFlashOn = false; 

        window.addEventListener('DOMContentLoaded', (event) => {
            let urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('pextumedata')) {
                let interceptedData = urlParams.get('pextumedata');
                if (interceptedData) { showScanResult(decodeURIComponent(interceptedData)); }
            }
        });

        function playSuccessBeep() {
            let beepEnabled = document.getElementById('beepToggle').checked;
            if (!beepEnabled) return; 

            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();

                oscillator.type = 'sine'; 
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 

                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) { console.log("Audio not supported", e); }
        }

        async function startCameraScanner() {
            document.getElementById('resultPanel').style.display = 'none';
            let container = document.getElementById('videoContainer');
            container.innerHTML = '<video id="scannerVideo" autoplay muted playsinline style="width:100%; height:100%; object-fit:cover;"></video>';
            
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                let video = document.getElementById('scannerVideo');
                video.srcObject = videoStream;
                
                video.onloadedmetadata = async function() {
                    try {
                        await video.play();
                        document.getElementById('scannerWrapper').style.display = 'block';
                        document.getElementById('startCamBtn').style.display = 'none';
                        
                        let track = videoStream.getVideoTracks()[0];
                        let capabilities = track.getCapabilities();
                        if (capabilities && capabilities.torch) {
                            let flashBtn = document.getElementById('flashToggleBtn');
                            flashBtn.style.display = 'flex';
                        }
                        animationFrameId = requestAnimationFrame(tickCameraFrame);
                    } catch(playErr) { console.log(playErr); }
                };
            } catch (err) {
    document.getElementById("scannerWrapper").style.display = "block";
    document.getElementById("videoContainer").innerHTML = "";
    document.getElementById("permissionVideo").style.display = "block";
}

        function executeInstantTorchToggle(event) {
            if (!videoStream) return;
            event.preventDefault(); 
            let track = videoStream.getVideoTracks()[0];
            isFlashOn = !isFlashOn;
            let flashBtn = document.getElementById('flashToggleBtn');
            if (isFlashOn) {
                flashBtn.style.color = "#fbbf24"; flashBtn.style.borderColor = "#fbbf24"; 
                flashBtn.style.background = "rgba(0, 0, 0, 0.2)"; flashBtn.style.boxShadow = "0 0 15px rgba(251, 191, 36, 0.4)";
            } else {
                flashBtn.style.color = "#94a3b8"; flashBtn.style.borderColor = "transparent"; 
                flashBtn.style.background = "transparent"; flashBtn.style.boxShadow = "none";
            }
            track.applyConstraints({ advanced: [{ torch: isFlashOn }] }).catch(err => {});
        }

        function processAdvancedSmartFilters(ctx, width, height) {
            let imgData = ctx.getImageData(0, 0, width, height);
            let d = imgData.data;
            
            let totalLuminance = 0, sampleCount = 0;
            for (let i = 0; i < d.length; i += 40) {
                let r = d[i]; let g = d[i+1]; let b = d[i+2];
                totalLuminance += (0.2126 * r + 0.7152 * g + 0.0722 * b);
                sampleCount++;
            }
            let avgLuminance = totalLuminance / sampleCount;
            let isDarkBackground = avgLuminance < 120;
            
            for (let i = 0; i < d.length; i += 4) {
                let r = d[i]; let g = d[i+1]; let b = d[i+2];
                let colorDiff = Math.abs(r - b); 
                
                if (colorDiff > 60) { 
                    d[i] = d[i+1] = d[i+2] = (r > b) ? 0 : 255; 
                } else {
                    let v = (0.2126 * r + 0.7152 * g + 0.0722 * b);
                    if (isDarkBackground) {
                        d[i] = d[i+1] = d[i+2] = v > avgLuminance ? 0 : 255;
                    } else {
                        d[i] = d[i+1] = d[i+2] = v > 128 ? 255 : 0;
                    }
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }
             function tickCameraFrame() {
            let video = document.getElementById('scannerVideo');
            if (!video) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                let canvas = document.createElement("canvas");
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                let ctx = canvas.getContext("2d", { willReadFrequently: true });
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                processAdvancedSmartFilters(ctx, canvas.width, canvas.height);
                
                let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                
                if (code && code.data) { 
                    if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
                    if (isFlashOn) { executeInstantHardwareTorchOff(); }
                    if (videoStream) { videoStream.getTracks().forEach(track => track.stop()); videoStream = null; }
                    
                    video.srcObject = null;
                    document.getElementById('videoContainer').innerHTML = ''; 
                    document.getElementById('scannerWrapper').style.display = 'none';
                    document.getElementById('flashToggleBtn').style.display = 'none'; 
                    document.getElementById('startCamBtn').style.display = 'block';
                    
                    playSuccessBeep();
                    showScanResult(code.data); 
                    return; 
                }
            }
            if (animationFrameId !== null) {
                animationFrameId = requestAnimationFrame(tickCameraFrame);
            }
        }

        function executeInstantHardwareTorchOff() {
            isFlashOn = false;
            let flashBtn = document.getElementById('flashToggleBtn');
            if(flashBtn) {
                flashBtn.style.color = "#94a3b8"; flashBtn.style.borderColor = "transparent"; 
                flashBtn.style.background = "transparent"; flashBtn.style.boxShadow = "none";
            }
            if (videoStream) {
                try {
                    let track = videoStream.getVideoTracks()[0];
                    track.applyConstraints({ advanced: [{ torch: false }] }).catch(e => {});
                } catch(e){}
            }
        }

        function stopCameraScanner() {
            if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
            if (isFlashOn) { executeInstantHardwareTorchOff(); }
            if (videoStream) { videoStream.getTracks().forEach(track => track.stop()); videoStream = null; }
            let video = document.getElementById('scannerVideo');
            if(video) { video.srcObject = null; }
            document.getElementById('videoContainer').innerHTML = '';
            document.getElementById('scannerWrapper').style.display = 'none';
            document.getElementById('flashToggleBtn').style.display = 'none'; 
            document.getElementById('startCamBtn').style.display = 'block';      
            navigator.mediaDevices.getUserMedia({ video: true }).then(str => str.getTracks().forEach(t => t.stop())).catch(e => {});
        }

        function scanQRFromImage(event) {
            let file = event.target.files[0];
            if (!file) return;
            document.getElementById("uploadLabel").innerHTML = "✓<br>" + file.name;
            stopCameraScanner();
            let reader = new FileReader();
            reader.onload = function(e) {
                let img = new Image();
                img.onload = function() {
                    let canvas = document.createElement("canvas");
                    canvas.width = img.width; canvas.height = img.height;
                    let ctx = canvas.getContext("2d", { willReadFrequently: true });
                    ctx.drawImage(img, 0, 0, img.width, img.height);
                    
                    processAdvancedSmartFilters(ctx, canvas.width, canvas.height);
                    
                    let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    let code = jsQR(imageData.data, imageData.width, imageData.height);
                    if (code) { 
                        playSuccessBeep();
                        showScanResult(code.data); 
                    } 
                    else { alert("No valid QR code found in this image!"); document.getElementById('resultPanel').style.display = 'none'; }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function parseContactQR(rawText) {
            let data = rawText.trim();
            let lowerData = data.toLowerCase();
            
            // 🎯 এসএমএস লেআউট: ইমেলের লেআউটের সাথে ১০০% সেম সাইজ ও ফন্টে ইনলাইন ম্যাচিং ভাই
            if (lowerData.startsWith("sms:") || lowerData.startsWith("smsto:")) {
                let cleanData = lowerData.startsWith("sms:") ? data.substring(4) : data.substring(6); 
                let parts = cleanData.split('?');
                let phoneNum = parts[0] || ""; 
                let bodyText = "";
                
                if (parts[1]) {
                    let queryParams = new URLSearchParams(parts[1]);
                    if (queryParams.has('body')) {
                        bodyText = queryParams.get('body');
                    }
                }
                
                try { bodyText = decodeURIComponent(bodyText); } catch(e) {}
                
                let prettySmsView = `💬 <b>SMS:</b> <a href="sms:${phoneNum}${bodyText ? '?body=' + encodeURIComponent(bodyText) : ''}" class="qr-scanned-link">🔗 Send SMS</a><br>`;
                prettySmsView += `📱 <b>Number:</b> ${phoneNum}<br>`;
                if(bodyText) { prettySmsView += `🗨️ <b>Msg:</b> ${bodyText}`; }
                return prettySmsView;
            }

            // 🎯 ইমেল লেআউট: (স্ট্যান্ডার্ড ফরম্যাট যা বাকি সবগুলোর মূল মডেল ভাই)
            if (lowerData.startsWith("mailto:") || (lowerData.includes("mailto:") && lowerData.includes("body="))) {
                let cleanData = data;
                if(lowerData.startsWith("mailto:")) { cleanData = data.substring(7); }
                let emailAddress = "", subjectText = "No Subject", bodyText = "";
                let parts = cleanData.split('?'); emailAddress = parts[0] || "";
                if (parts[1]) {
                    let queryParams = new URLSearchParams(parts[1]);
                    if (queryParams.has('subject')) subjectText = queryParams.get('subject');
                    if (queryParams.has('body')) bodyText = queryParams.get('body');
                }
                try {
                    emailAddress = decodeURIComponent(emailAddress);
                    subjectText = decodeURIComponent(subjectText);
                    bodyText = decodeURIComponent(bodyText);
                } catch(e) {}
                let beautifulEmailView = `✉️ <b>Email:</b> <a href="${data}" target="_blank" class="qr-scanned-link">🔗 Send Email</a><br>`;
                beautifulEmailView += `📧 <b>To:</b> ${emailAddress}<br>`;
                beautifulEmailView += `📝 <b>Subject:</b> ${subjectText}<br>`;
                beautifulEmailView += `📋 <b>Body:</b><br>${bodyText}`;
                return beautifulEmailView;
            }

            // 🎯 ভি-কার্ড লেআউট: ইমেলের লেআউটের সাথে ওয়ান-টু-ওয়ান সেম বোল্ড অ্যান্ড ইনলাইন ম্যাচ ভাই
            if (data.startsWith("MECARD:") || data.startsWith("BEGIN:VCARD")) {
                let name = "", org = "", tel = "", email = "";
                if (data.startsWith("MECARD:")) {
                    let nameMatch = data.match(/N:([^;]+)/); let orgMatch = data.match(/ORG:([^;]+)/);
                    let telMatch = data.match(/TEL:([^;]+)/); let emailMatch = data.match(/EMAIL:([^;]+)/);
                    if(nameMatch) name = nameMatch[1]; if(orgMatch) org = orgMatch[1]; if(telMatch) tel = telMatch[1]; if(emailMatch) email = emailMatch[1];
                } else {
                    let fnMatch = data.match(/FN:([^\n\r]+)/); let orgMatch = data.match(/ORG:([^\n\r]+)/);
                    let telMatch = data.match(/TEL[^\:]*:([^\n\r]+)/); let emailMatch = data.match(/EMAIL[^\:]*:([^\n\r]+)/);
                    if(fnMatch) name = fnMatch[1]; if(orgMatch) org = orgMatch[1]; if(telMatch) tel = telMatch[1]; if(emailMatch) email = emailMatch[1];
                    org = org.replace(/;/g, '').trim();
                }
                let beautifulView = "";
                if(name) beautifulView += "👤 <b>Name:</b> " + name + "<br>";
                if(org) beautifulView += "🏢 <b>Company:</b> " + org + "<br>";
                if(tel) beautifulView += `📞 <b>Tel:</b> <a href="tel:${tel.trim()}" class="qr-scanned-link">🔗 Call</a> (${tel})<br>`;
                if(email) beautifulView += `✉️ <b>Email:</b> <a href="mailto:${email.trim()}" class="qr-scanned-link">🔗 Email</a> (${email})`;
                return beautifulView ? beautifulView.trim() : rawText;
            }

            // 🎯 কল/টেল লেআউট: মোবাইল চিহ্ন ও পাশে Number লেখা সহ ১০০% সেম সাইজ ম্যাচ ভাই
            if (lowerData.startsWith("tel:")) {
                let numOnly = data.substring(4).trim();
                return `📞 <b>Tel:</b> <a href="tel:${numOnly}" class="qr-scanned-link">🔗 Call Number</a><br>📱 <b>Number:</b> ${numOnly}`;
            }

            // 🎯 সলিড ফোন নম্বর ডিটেকশন লেআউট:
            if (/^\+?[0-9\s\-]{7,15}$/.test(data)) {
                return `📞 <b>Tel:</b> <a href="tel:${data}" class="qr-scanned-link">🔗 Call Number</a><br>📱 <b>Number:</b> ${data}`;
            }

            // 🎯 রেন্ডম ইমেল টেক্সট লেআউট:
            if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data)) { return `📧 <b>Email:</b> <a href="mailto:${data}" class="qr-scanned-link">🔗 Send Email</a><br>📧 <b>To:</b> ${data}`; }
            
            // 🎯 ওয়েব লিংক লেআউট:
            if (data.startsWith("http://") || data.startsWith("https://")) {
                return `🌐 <b>Web Link:</b> <a href="${data}" target="_blank" class="qr-scanned-link">🔗 Open Link</a><br>🔗 <b>URL:</b> ${data}`;
            }

            // 🎯 সাধারণ রেন্ডম টেক্সট লেআউট: শুরুতে টেক্সট লোগো সহ সেম সাইজ ও বোল্ড স্টাইল ভাই
            if (data.length > 0) {
                return `📝 <b>Text:</b> ${data}`;
            }

            return rawText; 
        }

        // 👑 গ্লোবাল স্মার্ট ইউনিভার্সাল হ্যান্ডলার ইঞ্জিন ভাই (যাতে অন্য কোনো অপরিচিত কিউআর এলেও কোড না আটকায়)
        function checkUniversalFallback(data) {
            let lowerData = data.toLowerCase();
            if (!lowerData.startsWith("sms:") && !lowerData.startsWith("smsto:") && !lowerData.startsWith("mailto:") && 
                !data.startsWith("MECARD:") && !data.startsWith("BEGIN:VCARD") && !lowerData.startsWith("tel:") && 
                !/^\+?[0-9\s\-]{7,15}$/.test(data) && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data) && 
                !data.startsWith("http://") && !data.startsWith("https://") && data.length > 0) {
                
                let displayTitle = "📄 Raw Text";
                if (lowerData.startsWith("wifi:")) displayTitle = "📶 Wi-Fi Network";
                else if (lowerData.startsWith("geo:")) displayTitle = "📍 Geolocation";
                else if (lowerData.includes("t.me/") || lowerData.includes("whatsapp.com")) displayTitle = "📱 Social Link";
                
                return `<b>${displayTitle}:</b> ${data}`;
            }
            return null;
        }

        function showScanResult(data) {
            rawDataForClipboard = data.trim(); 
            let fallbackData = checkUniversalFallback(rawDataForClipboard);
            let displayData = fallbackData ? fallbackData : parseContactQR(rawDataForClipboard);
            
            document.getElementById('resultText').innerHTML = displayData;
            document.getElementById('resultPanel').style.display = 'block';
            let actBtn = document.getElementById('actionBtn');
            
            if (rawDataForClipboard.startsWith("http://") || rawDataForClipboard.startsWith("https://")) {
                actBtn.innerText = "📋 Copy Link URL";
            } else if (rawDataForClipboard.toLowerCase().startsWith("mailto:") || rawDataForClipboard.toLowerCase().includes("subject=")) {
                actBtn.innerText = "📋 Copy Clean Email Data";
            } else {
                actBtn.innerText = "📋 Copy Text to Clipboard";
            }
        }

        document.addEventListener('click', function(event) {
            var sideMenu = document.getElementById('sideMenu'); var menuBtn = document.getElementById('menuBtnWrapper');
            if (!sideMenu.contains(event.target) && !menuBtn.contains(event.target)) { sideMenu.style.transform = 'translateX(100%)'; }
        });
        
        function handleResultAction() { 
            let textToCopy = rawDataForClipboard;
            if (textToCopy.toLowerCase().startsWith("mailto:")) {
                try { textToCopy = decodeURIComponent(textToCopy); } catch(e) {}
            }
            navigator.clipboard.writeText(textToCopy); 
            alert("Data successfully copied! 👍"); 
        }
    </script>
</body>
</html>
