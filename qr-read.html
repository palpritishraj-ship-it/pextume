    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary-green: #00d2a0; 
            --btn-green: #00cc99;
            --btn-green-hover: #00b386;
            --light-gray: #f8fafc;
            --border-color: #e2e8f0;
            --link-blue: #0284c7;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overflow-x: hidden; width: 100%; max-width: 100%;
        }

        body {
            background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; margin: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: start;
            padding: 110px 20px 0px 20px; box-sizing: border-box;
        }

        .main-fixed-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 54px;
            background-color: #ffffff; z-index: 2500000; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .top-header {
            width: 100%; height: 100%;  
            background: linear-gradient(to right, rgba(0, 210, 160, 1) 0%, rgba(0, 210, 160, 0.6) 40%, rgba(255, 255, 255, 0) 85%);
            pointer-events: none; 
        }

        .logo-box {
            position: fixed; top: 6px; left: 8px; z-index: 2600000;  
            background: #000000; padding: 5px 8px; border-radius: 12px;
            display: inline-block; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(0, 210, 160, 0.3); 
        }

        .brand-logo { width: 120px; height: auto; display: block; filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.3)); }

        .top-menu-wrapper-fixed { position: fixed; top: 10px; right: 20px; z-index: 2600000; }

        .app-container {
            width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; text-align: center; box-sizing: border-box; margin-top: 20px; 
            flex: none; margin-bottom: 0px; padding-bottom: 0px;
        }

        h2 { color: var(--btn-green); font-family: 'Montserrat', sans-serif; font-size: 26px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }

        .mid-section-header-container {
            display: flex; justify-content: space-between; align-items: center; margin: 25px 0 5px 0; border-bottom: 1.5px solid var(--border-color); padding-bottom: 5px; width: 100%;
        }

        .mid-section-title { font-size: 11px; color: #b45309; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }

        .mid-history-btn {
            font-size: 11px; color: var(--link-blue); font-weight: 600; text-transform: uppercase;
            cursor: pointer; letter-spacing: 0.5px; background: #f0fdf4; padding: 3px 10px;
            border-radius: 12px; border: 1px solid rgba(0, 210, 160, 0.2);
            transition: all 0.2s ease; display: flex; align-items: center; gap: 4px;
        }
        .mid-history-btn:hover { background: #dcfce7; transform: translateY(-1px); }

        p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }

        .settings-bar {
            display: flex; align-items: center; justify-content: space-between; background: var(--light-gray); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 12px; margin-bottom: 5px; font-size: 0.85rem; color: #475569; font-weight: 600;
        }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--btn-green); }
        input:checked + .slider:before { transform: translateX(20px); }

        .scanner-view-wrapper {
            position: relative; width: 100%; max-width: 280px; height: 280px; margin: 10px auto 10px auto; border-radius: 20px; overflow: hidden; background: #000; border: 3.5px solid var(--primary-green); box-shadow: 0 15px 35px rgba(0, 210, 160, 0.15); display: none; 
        }

        #scannerVideo { width: 100%; height: 100%; object-fit: cover; }
        .scanner-laser { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(to right, transparent, var(--primary-green), transparent); box-shadow: 0 0 10px var(--primary-green); animation: scanning 2s linear infinite; }

        .flash-btn-overlay {
            position: absolute; top: 15px; right: 15px; z-index: 10; background: transparent; border: 2px solid transparent; color: #94a3b8; width: 44px; height: 44px; border-radius: 50%; font-size: 1.5rem; display: none; align-items: center; justify-content: center; cursor: pointer; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .stop-btn-overlay {
            position: absolute; top: 15px; left: 15px; z-index: 10; background: transparent !important; border: none !important; color: #ffffff; width: 44px; height: 44px; font-size: 1.6rem; display: flex; align-items: center; justify-content: center; cursor: pointer; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        @keyframes scanning { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }

        .file-upload-wrapper { position: relative; margin: 10px 0; width: 100%; }
        .file-upload-btn { display: block; text-align: center; background: var(--light-gray); border: 2px dashed var(--btn-green); color: var(--text-main); padding: 14px; border-radius: 14px; cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: all 0.2s ease; }
        .file-upload-btn:hover { background: #f1f5f9; box-shadow: 0 0 12px rgba(0, 210, 160, 0.15); }
        .file-upload-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

        .preview-panel { width: 100%; background: #ffffff; border: 1.5px dashed #cbd5e1; border-radius: 20px; padding: 20px 14px; margin-top: 10px; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .preview-image { max-width: 130px; max-height: 130px; border-radius: 14px; border: 2px solid var(--primary-green); box-shadow: 0 8px 20px rgba(0, 210, 160, 0.08); object-fit: contain; }
        .preview-filename { font-size: 0.85rem; color: #64748b; margin-top: 12px; font-weight: 500; word-break: break-all; }

        .result-panel { background: var(--light-gray); border: 1.5px solid var(--primary-green); border-radius: 16px; padding: 18px; margin-top: 15px; text-align: left; display: none; }
        .result-text { color: var(--text-main); font-size: 0.95rem; word-break: break-word; white-space: pre-wrap; margin-bottom: 5px; background: #ffffff; padding: 14px; border-radius: 10px; border: 1px solid var(--border-color); max-height: 250px; overflow-y: auto; line-height: 1.6; }
        .qr-scanned-link { color: var(--link-blue) !important; text-decoration: underline !important; font-weight: 600; word-break: break-all; }

        .action-btn { 
            background: var(--btn-green); color: white; border: none; padding: 14px; 
            font-size: 1rem; font-weight: 600; border-radius: 14px; cursor: pointer; 
            width: 100%; transition: all 0.2s ease; margin-top: 10px; box-shadow: none; outline: none;
        }

        .upload-loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.04); backdrop-filter: blur(0px); z-index: 100000; display: none; align-items: center; justify-content: center;
        }

        .loading-spinner-card {
            background: #ffffff; padding: 24px 35px; border-radius: 20px;
            box-shadow: 0 15px 40px rgba(15, 23, 25, 0.15); display: flex; flex-direction: column; align-items: center; gap: 14px; border: 1px solid var(--border-color);
        }

        .spinner-circle-logo {
            width: 44px; height: 44px; border: 4px solid #f1f5f9; border-top: 4px solid var(--btn-green); border-radius: 50%; animation: spinCircular 0.8s linear infinite;
        }

        @keyframes spinCircular { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text-label { font-size: 0.95rem; font-weight: 600; color: var(--text-main); letter-spacing: 0.3px; text-transform: uppercase; }

        .history-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.04); backdrop-filter: blur(0px); z-index: 100000; 
            display: none; align-items: center; justify-content: center; padding: 16px;
        }

        .history-modal-content {
            background: #ffffff; width: 100%; max-width: 395px; border-radius: 28px;
            padding: 22px; box-shadow: 0 25px 55px rgba(15, 23, 25, 0.15);
            display: flex; flex-direction: column; max-height: 82vh;
            border: 2.5px solid var(--primary-green); 
            animation: modalScale 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalScale {
            from { transform: scale(0.92) translateY(12px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .history-modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; border-bottom: 1px dashed var(--border-color); padding-bottom: 12px;
        }
        .history-modal-title { font-size: 1.15rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .history-close-btn {
            font-size: 22px; color: #94a3b8; cursor: pointer; background: #f1f5f9; 
            width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600;
        }
        .history-close-btn:hover { color: #ef4444; background: #fee2e2; }

        .history-list-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; }

        .history-card {
            background: #ffffff; border: 1px solid #f1f5f9; border-radius: 16px;
            padding: 14px; position: relative; display: flex; flex-direction: column; gap: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.01);
        }
        .history-card:hover { border-color: rgba(0, 210, 160, 0.2); }
        
        .history-card-top-meta { display: flex; justify-content: space-between; align-items: center; width: 100%; position: relative;}
        .history-card-date { font-size: 0.74rem; color: #94a3b8; font-weight: 600; display: flex; align-items: center; gap: 4px; }

        .history-three-dot-btn {
            font-size: 1.2rem; color: #94a3b8; cursor: pointer; width: 28px; height: 28px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            user-select: none; font-weight: bold;
        }
        .history-three-dot-btn:hover { background: #f1f5f9; color: var(--text-main); }

        .history-action-dropdown-menu {
            position: absolute; top: 32px; right: 0; background: #ffffff;
            border: 1px solid var(--border-color); border-radius: 12px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12); width: 110px;
            z-index: 50; display: none; flex-direction: column; overflow: hidden;
            animation: menuFadeIn 0.18s ease;
        }

        @keyframes menuFadeIn {
            from { opacity: 0; transform: translateY(-5px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .dropdown-menu-item {
            font-size: 0.82rem; color: #334155; padding: 10px 14px; cursor: pointer;
            font-weight: 600; display: flex; align-items: center; gap: 6px;
            transition: background 0.15s; text-align: left; user-select: none;
        }
        .dropdown-menu-item:hover { background: var(--light-gray); color: var(--text-main); }
        .item-delete:hover { background: #fee2e2; color: #ef4444; }

        .history-card-body {
            color: #334155; font-size: 0.88rem; word-break: break-word; line-height: 1.45;
            padding: 4px 20px 0 0; border-top: 1px solid #f8fafc; margin-top: 2px;
            max-height: 85px; overflow: hidden; text-overflow: ellipsis;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
        }

        .no-history-text { text-align: center; color: #94a3b8; font-size: 0.88rem; margin: 45px 0; font-weight: 500; }

        .clear-history-btn {
            background: #ef4444 !important; color: white !important; border: none !important; padding: 12px !important;
            font-size: 0.9rem !important; font-weight: 600 !important; border-radius: 14px !important; cursor: pointer;
            width: 100%; margin-top: 14px; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2) !important;
            transition: background 0.2s ease, transform 0.1s ease !important;
        }
        .clear-history-btn:hover { background: #dc2626 !important; }
        .clear-history-btn:active { transform: scale(0.98) !important; }

        .pextume-premium-footer {
            background: #ffffff; color: var(--text-muted); 
            width: 100%; max-width: 100%; 
            padding: 15px 0px 30px 0px; margin-top: 0px; border-top: none;
            text-align: left !important;
        }

        .footer-grid-layout {
            width: 100%; max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;
            justify-content: start; align-items: start;
        }

        .footer-column-box {
            width: 100%; text-align: left !important;
        }

        .footer-column-box h3 {
            color: var(--text-main); font-family: 'Montserrat', sans-serif; font-size: 14px;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;
            display: inline-block; width: auto; position: relative;
            text-decoration: underline; text-decoration-color: var(--btn-green);
            text-decoration-thickness: 2.5px; text-underline-offset: 5px;
        }

        .footer-brand-title { 
            color: var(--btn-green) !important; font-size: 18px !important; font-weight: 700; 
            text-decoration: none !important; margin-bottom: 6px !important; display: inline-block;
        }
        
        .footer-brand-desc { font-size: 0.86rem; line-height: 1.5; color: var(--text-muted); text-align: left; }

        .footer-links-list { list-style: none; display: flex; flex-direction: column; gap: 8px; align-items: start; }
        .footer-links-list li { width: 100%; text-align: left; }
        
        .footer-links-list li a {
            color: #475569 !important; text-decoration: none !important; font-size: 0.88rem; font-weight: 600;
            transition: color 0.15s, padding-left 0.15s; cursor: pointer; display: inline-block;
            outline: none !important; -webkit-tap-highlight-color: transparent !important;
        }

        .footer-links-list li a:hover, 
        .footer-links-list li a:active, 
        .footer-links-list li a:focus,
        .footer-links-list li a:focus-visible { 
            color: #475569 !important; 
            padding-left: 4px; text-decoration: none !important; outline: none !important;
        }

        .footer-links-list li a::selection { background: transparent !important; color: #475569 !important; }
        .footer-links-list li a::-moz-selection { background: transparent !important; color: #475569 !important; }

        .footer-divider-line { 
            width: 100%; max-width: 420px; margin: 25px auto 15px auto; border: 0; 
            border-top: 1.5px solid var(--border-color); 
        }
        
        .footer-bottom-copyright-bar { 
            width: 100%; max-width: 420px; margin: 0 auto; text-align: center; 
            font-size: 0.82rem; color: #94a3b8; font-weight: 500; letter-spacing: 0.2px;
            white-space: nowrap !important; display: block; 
            overflow: hidden; text-overflow: clip; padding: 0px;
        }

        .info-popup-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.04); backdrop-filter: blur(0px);
            z-index: 100000; display: none; align-items: center; justify-content: center; padding: 20px;
        }

        .info-popup-content-card {
            background: #ffffff; width: 100%; max-width: 480px; border-radius: 24px;
            padding: 24px; box-shadow: 0 25px 60px rgba(15, 23, 25, 0.15);
            border: 2.5px solid var(--primary-green); display: flex; flex-direction: column; max-height: 85vh;
            animation: modalScale 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .info-popup-content-card .history-close-btn {
            font-size: 22px; color: #94a3b8 !important; cursor: pointer; background: #f1f5f9 !important; 
            width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600;
            outline: none !important; -webkit-tap-highlight-color: transparent !important; transition: background 0.15s, color 0.15s;
        }
        .info-popup-content-card .history-close-btn:hover, .info-popup-content-card .history-close-btn:active {
            color: var(--text-main) !important; background: #e2e8f0 !important;
        }

        .info-popup-body-scroller { flex: 1; overflow-y: auto; margin: 15px 0; padding-right: 4px; text-align: left; }
        .info-popup-body-scroller h4 { color: var(--text-main); font-size: 1rem; margin: 16px 0 6px 0; font-weight: 600; }
        .info-popup-body-scroller p { font-size: 0.86rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 12px; text-align: left; }
        .info-popup-body-scroller ol, .info-popup-body-scroller ul { margin-left: 18px; margin-bottom: 12px; font-size: 0.86rem; color: var(--text-muted); }

        <body>
    <div class="main-fixed-header">
        <div class="top-header"></div>
    </div>
    <div class="logo-box">
        <img src="logo.png" alt="Pextume Logo" class="brand-logo">
    </div>
    <div class="app-container">
        <h2>QR Code Scanner</h2>
        <p>Scan any QR code with your device camera or quickly drop an image here from your device gallery.</p>

        <div class="settings-bar">
            <span>🔊 Scan Success Beep Sound</span>
            <label class="switch">
                <input type="checkbox" id="beepToggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <button class="action-btn" id="startCamBtn" onmouseover="this.style.background='var(--btn-green-hover)'" onmouseout="this.style.background='var(--btn-green)'" onclick="startCameraScanner()">📷 Start Live Camera Scan</button>
        
        <div class="scanner-view-wrapper" id="scannerWrapper">
            <div class="scanner-laser"></div>
            <div class="stop-btn-overlay" id="stopCamOverlayBtn" onclick="stopCameraScanner()">✕</div>
            <div class="flash-btn-overlay" id="flashToggleBtn" onpointerdown="executeInstantTorchToggle(event)">⚡</div>
            <div id="videoContainer" style="width:100%; height:100%;"></div>
        </div>

        <div class="mid-section-header-container">
            <div class="mid-section-title">Or Upload Image</div>
            <div class="mid-history-btn" onclick="openHistoryModalBox()">⏱️ QR history</div>
        </div>

        <div class="file-upload-wrapper">
            <label for="qrImageUpload" id="uploadLabel" class="file-upload-btn">📁 Choose QR Image from Gallery</label>
            <input type="file" id="qrImageUpload" accept="image/*" onchange="scanQRFromImage(event)">
        </div>

        <div class="preview-panel" id="imagePreviewPanel">
            <img src="" alt="Scanned QR Preview" class="preview-image" id="previewImgElement">
            <div class="preview-filename" id="previewFileNameText">filename.png</div>
        </div>

        <div class="result-panel" id="resultPanel">
            <div class="section-title" style="margin-top:0; color:#c2410c; border-bottom: none; padding-bottom: 0;">✓ Scanned Result:</div>
            <div class="result-text" id="resultText">Result will appear here...</div>
            <button class="action-btn" id="actionBtn" onclick="handleResultAction()">📋 Copy Text to Clipboard</button>
        </div>
    </div>

    <div class="upload-loading-overlay" id="uploadLoadingOverlay">
        <div class="loading-spinner-card">
            <div class="spinner-circle-logo"></div>
            <div class="loading-text-label">Scanning...</div>
        </div>
    </div>
           <div class="history-modal" id="historyModalBox" onclick="closeHistoryModalBox()">
        <div class="history-modal-content" id="modalMainContentBox" onclick="event.stopPropagation(); executeBlankSpaceMenuClose(event)">
            <div class="history-modal-header">
                <div class="history-modal-title">🕰️ QR Scanned History</div>
                <div class="history-close-btn" onclick="closeHistoryModalBox()">&times;</div>
            </div>
            <div class="history-list-container" id="historyListContainer"></div>
            <button class="clear-history-btn" id="clearHistoryBtn" onclick="executeClearAllHistory()">🗑️ Clear All History</button>
        </div>
    </div>

                <h3 class="footer-brand-title">PEXTUME</h3>

            </div>
            <div class="footer-column-box">
                <h3>User Support</h3>
                <ul class="footer-links-list">
                    <li><a onclick="openInfoPopupModal('how-to-use')">📖 How to Use</a></li>
                    <li><a onclick="openInfoPopupModal('faq')">❓ FAQ Guide</a></li>
                    <li><a onclick="openInfoPopupModal('contact')">📧 Contact Us</a></li>
                </ul>
            </div>
            <div class="footer-column-box">
                <h3>Legal Bureau</h3>
                <ul class="footer-links-list">
                    <li><a onclick="openInfoPopupModal('privacy')">🛡️ Privacy Policy</a></li>
                    <li><a onclick="openInfoPopupModal('terms')">📝 Terms of Service</a></li>
                    <li><a onclick="openInfoPopupModal('disclaimer')">⚖️ Disclaimer</a></li>
                </ul>
            </div>
        </div>
        <hr class="footer-divider-line">
        <div class="footer-bottom-copyright-bar">
            © 2026 Pextume Utility Network. All Rights Reserved.
        </div>

    <script>
        let videoStream = null;

        function playSuccessBeep() {
            let beepEnabled = document.getElementById('beepToggle').checked;
            if (!beepEnabled) return; 
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                oscillator.type = 'sine'; oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) { console.log("Audio not supported", e); }
        }

        async function startCameraScanner() {
            try {
                const permissionStatus = await navigator.permissions.query({ name: 'camera' });
                if (permissionStatus.state === 'denied') {
                    alert("📷 Camera Blocked! Please check your browser settings to Allow camera access.");
                    return;
                }
            } catch (pErr) {}

            document.getElementById('resultPanel').style.display = 'none';
            document.getElementById('imagePreviewPanel').style.display = 'none';
            let container = document.getElementById('videoContainer');
            container.innerHTML = '<video id="scannerVideo" autoplay muted playsinline style="width:100%; height:100%; object-fit:cover;"></video>';
            
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                let video = document.getElementById('scannerVideo');
                video.srcObject = videoStream;
                
                video.onloadedmetadata = async function() {
                    try {
                        await video.play();
                        document.getElementById('scannerWrapper').style.display = 'block';
                        document.getElementById('startCamBtn').style.display = 'none';
                        
                        let track = videoStream.getVideoTracks()[0];
                        let capabilities = track.getCapabilities();
                        if (capabilities && capabilities.torch) { 
                            document.getElementById('flashToggleBtn').style.display = 'flex'; 
                        } else {
                            document.getElementById('flashToggleBtn').style.display = 'none';
                        }
                        
                        if (animationFrameId) cancelAnimationFrame(animationFrameId);
                        animationFrameId = requestAnimationFrame(tickCameraFrame);
                    } catch(playErr) {}
                };
            } catch (err) { 
                alert("📷 Camera Blocked or not supported on this device!"); 
            }
        }

        function stopCameraScanner() {
            if (animationFrameId) { 
                cancelAnimationFrame(animationFrameId); 
                animationFrameId = null; 
            }
            if (isFlashOn) {
                try {
                    let track = videoStream.getVideoTracks()[0];
                    track.applyConstraints({ advanced: [{ torch: false }] });
                } catch(e) {}
                isFlashOn = false;
            }
            if (videoStream) { 
                videoStream.getTracks().forEach(track => track.stop()); 
                videoStream = null; 
            }
            
            let wrapper = document.getElementById('scannerWrapper');
            if(wrapper) wrapper.style.display = 'none';
            
            let startBtn = document.getElementById('startCamBtn');
            if(startBtn) startBtn.style.display = 'block';
            
            let flashBtn = document.getElementById('flashToggleBtn');
            if(flashBtn) flashBtn.style.display = 'none';
            
            let container = document.getElementById('videoContainer');
            if(container) container.innerHTML = '';
        }

        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {

        function executeInstantTorchToggle(event) {
            if (!videoStream) return;
            event.preventDefault(); 
            let track = videoStream.getVideoTracks()[0];
            isFlashOn = !isFlashOn;
            let flashBtn = document.getElementById('flashToggleBtn');
            if (isFlashOn) {
                flashBtn.style.color = "#fbbf24"; flashBtn.style.borderColor = "#fbbf24";

                flashBtn.style.color = "#94a3b8"; flashBtn.style.borderColor = "transparent"; 
                flashBtn.style.background = "transparent"; flashBtn.style.boxShadow = "none";
            }
            track.applyConstraints({ advanced: [{ torch: isFlashOn }] }).catch(err => {});
        }

        function processAdvancedSmartFilters(ctx, width, height) {
            let imgData = ctx.getImageData(0, 0, width, height);
            let d = imgData.data;
            let totalLuminance = 0;
            for (let i = 0; i < d.length; i += 4) {
                let r = d[i], g = d[i+1], b = d[i+2];
                totalLuminance += Math.round(0.2126 * r + 0.7152 * g + 0.0722 * b);
            }
            let avgLuminance = totalLuminance / (d.length / 4);
            let threshold = avgLuminance;
            if (threshold < 40) threshold = 40;
            if (threshold > 210) threshold = 210;

            for (let i = 0; i < d.length; i += 4) {
                let r = d[i], g = d[i+1], b = d[i+2];
                let currentGray = Math.round(0.2126 * r + 0.7152 * g + 0.0722 * b);
                let isYellowGold = (r > 150 && g > 130 && b < 110);
                if (isYellowGold) { d[i] = d[i+1] = d[i+2] = 0; } 
                else { d[i] = d[i+1] = d[i+2] = (currentGray > threshold) ? 255 : 0; }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function tickCameraFrame() {
            let video = document.getElementById('scannerVideo');
            if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
                let canvas = document.createElement("canvas");
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                let ctx = canvas.getContext("2d", { willReadFrequently: true });
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "attemptBoth" });
                
                if (!code) {
                    processAdvancedSmartFilters(ctx, canvas.width, canvas.height);
                    let filteredData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    code = jsQR(filteredData.data, filteredData.width, filteredData.height, { inversionAttempts: "attemptBoth" });
                }

                if (code && code.data) {
                    playSuccessBeep();
                    stopCameraScanner();
                    showScanResult(code.data, "", "Live_Camera_Scan.jpg");
                    return;
                }
            }
            if (videoStream) {
                animationFrameId = requestAnimationFrame(tickCameraFrame);
            }
        }

        function scanQRFromImage(event) {
            let file = event.target.files[0]; if (!file) return;
            document.getElementById("uploadLabel").innerHTML = "📁 Choose QR Image from Gallery";
            
            let loadingOverlay = document.getElementById('uploadLoadingOverlay'); 
            loadingOverlay.style.display = 'flex'; 

            if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
            if (videoStream) { stopCameraScanner(); }
            
            setTimeout(async () => {
                let reader = new FileReader();
                reader.onload = async function(e) {
                    let img = new Image();
                    img.onload = async function() {
                        let canvas = document.createElement("canvas");
                        canvas.width = img.width; canvas.height = img.height;
                        let ctx = canvas.getContext("2d", { willReadFrequently: true });
                        ctx.drawImage(img, 0, 0, img.width, img.height);

                        let codeData = null;

                        try {
                            if ('BarcodeDetector' in window) {
                                const detector = new BarcodeDetector({ formats: ['qr_code'] });
                                const results = await detector.detect(img);
                                if (results.length > 0 && results[0].rawValue) {
                                    codeData = results[0].rawValue;
                                }
                            }
                        } catch (err) {}

                        if (!codeData) {
                            let rawImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            let code = jsQR(rawImageData.data, rawImageData.width, rawImageData.height, { inversionAttempts: "attemptBoth" });
                            if (code && code.data) codeData = code.data;
                        }

                        if (!codeData) {
                            ctx.drawImage(img, 0, 0, img.width, img.height);
                            processAdvancedSmartFilters(ctx, canvas.width, canvas.height);
                            let filteredData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            let codeFiltered = jsQR(filteredData.data, filteredData.width, filteredData.height, { inversionAttempts: "attemptBoth" });
                            if (codeFiltered && codeFiltered.data) codeData = codeFiltered.data;
                        }

                        if (!codeData) {
                            ctx.drawImage(img, 0, 0, img.width, img.height);
                            let rawImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            let d = rawImageData.data;
                            for (let i = 0; i < d.length; i += 4) {
                                d[i] = 255 - d[i]; d[i+1] = 255 - d[i+1]; d[i+2] = 255 - d[i+2];
                            }
                            ctx.putImageData(rawImageData, 0, 0);
                            let codeInverted = jsQR(rawImageData.data, rawImageData.width, rawImageData.height, { inversionAttempts: "attemptBoth" });
                            if (codeInverted && codeInverted.data) codeData = codeInverted.data;
                        }

                        loadingOverlay.style.display = 'none';

                        if (codeData) { 
                            playSuccessBeep(); 
                            let finalImgSrc = e.target.result || "";
                            let finalFileName = file.name || "Scanned_QR.jpg";
                            let parsedDisplay = parseContactQR(codeData.trim());
                            
                            showScanResult(codeData.trim(), finalImgSrc, finalFileName);
                            rawDataForClipboard = codeData.trim();
                        } else { 
                            alert("No valid QR code found in this image!"); 
                            document.getElementById('resultPanel').style.display = 'none'; 
                            document.getElementById('imagePreviewPanel').style.display = 'none'; 
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
                event.target.value = '';
            }, 50);
        }
                      const tagTranslationMap = { "N": "Name", "FN": "Full Name", "TEL": "Telephone", "EMAIL": "Email", "ADR": "Address", "ORG": "Organization", "TITLE": "Title", "URL": "Website", "NOTE": "Note", "BDAY": "Birthday" };

        function parseContactQR(rawText) {
            let data = rawText.trim(); let upperData = data.toUpperCase(); let resultHtml = ""; let cardHeaderTitle = ""; let lowerData = data.toLowerCase();
            if (lowerData.startsWith("mailto:") || lowerData.startsWith("sms:") || lowerData.startsWith("smsto:") || lowerData.startsWith("tel:")) {
                let prefix = lowerData.startsWith("mailto:") ? "mailto:" : (lowerData.startsWith("sms:") ? "sms:" : (lowerData.startsWith("smsto:") ? "smsto:" : "tel:"));
                if (prefix === "mailto:") cardHeaderTitle = "Email Address"; else if (prefix === "tel:") cardHeaderTitle = "Phone Number"; else cardHeaderTitle = "SMS Message";
                let cleanBody = data.substring(prefix.length); let segments = cleanBody.split('?'); let mainTarget = segments[0] || ""; let outputLines = [];
                outputLines.push(`<b>To:</b> ${mainTarget}`);
                if (segments[1]) {
                    let queryParams = segments[1].split('&');
                    queryParams.forEach(param => {
                        let pair = param.split('=');
                        if (pair[0]) {
                            let key = pair[0].toLowerCase(); let val = pair[1] ? decodeURIComponent(pair[1].replace(/\+/g, ' ')) : "";
                            let displayTag = key === "body" ? "Body" : (key === "subject" ? "Subject" : pair[0].charAt(0).toUpperCase() + pair[0].slice(1));
                            if (val.trim()) { outputLines.push(`<b>${displayTag}:</b> ${val}`); }
                        }
                    });
                }
                resultHtml = outputLines.join('<br>'); return `<div style="font-size:1.05rem; color:#0284c7; font-weight:600; margin-bottom:12px; letter-spacing:0.5px;">${cardHeaderTitle}</div>` + resultHtml;
            }
            if (data.toLowerCase().startsWith("http://") || data.toLowerCase().startsWith("https://")) {
                cardHeaderTitle = "Web Link"; let linkifiedVal = data.replace(/(https?:\/\/[^\s]+)/gi, '<a href="$1" target="_blank" class="qr-scanned-link">$1</a>');
                return `<div style="font-size:1.05rem; color:#0284c7; font-weight:600; margin-bottom:12px; letter-spacing:0.5px;">${cardHeaderTitle}</div>` + linkifiedVal;
            }
            if (upperData.startsWith("MECARD:") || upperData.startsWith("BEGIN:VCARD")) { cardHeaderTitle = upperData.startsWith("BEGIN:VCARD") ? "Card" : "Contact (MECARD)"; if (upperData.startsWith("MECARD:")) data = data.substring(7); }
            let rawLines = data.split(/\r?\n/); if (rawLines.length <= 2 && data.includes(";")) { rawLines = data.split(';'); }
            let finalLines = []; let seenEntries = new Set();
            rawLines.forEach(line => {
                let cleanLine = line.trim(); if (!cleanLine || cleanLine === "BEGIN:VCARD" || cleanLine === "END:VCARD" || cleanLine.toUpperCase().startsWith("VERSION:")) return;
                if (cleanLine.toLowerCase().startsWith("http://") || cleanLine.toLowerCase().startsWith("https://")) {
                    let linkifiedClean = cleanLine.replace(/(https?:\/\/[^\s]+)/gi, '<a href="$1" target="_blank" class="qr-scanned-link">$1</a>');
                    if(linkifiedClean.endsWith(';')) linkifiedClean = linkifiedClean.slice(0, -1).trim(); finalLines.push(linkifiedClean); return;
                }
                let firstColonIdx = cleanLine.indexOf(':');
                if (firstColonIdx !== -1) {
                    let leftPart = cleanLine.substring(0, firstColonIdx).trim(); let rawValue = cleanLine.substring(firstColonIdx + 1).trim(); if (!leftPart || !rawValue) return;
                    let baseTag = leftPart.split(/[;=]+/)[0].toUpperCase(); let cleanValue = rawValue.replace(/^(CHARSET=[A-Z0-9\-]+:?|TYPE=[A-Z0-9,]+:?)+/i, '').trim();
                    if(cleanValue.startsWith(':') || cleanValue.startsWith(';')) cleanValue = cleanValue.substring(1).trim(); if(cleanValue.endsWith(';')) cleanValue = cleanValue.slice(0, -1).trim(); if (!cleanValue) return;
                    let displayTag = tagTranslationMap[baseTag] ? tagTranslationMap[baseTag] : baseTag; let uniqueKey = displayTag + "||" + cleanValue; if (seenEntries.has(uniqueKey)) return; seenEntries.add(uniqueKey);
                    let linkifiedVal = cleanValue.replace(/(https?:\/\/[^\s]+)/gi, '<a href="$1" target="_blank" class="qr-scanned-link">$1</a>'); finalLines.push(`<b>${displayTag}:</b> ${linkifiedVal}`);
                } else {
                    let linkifiedClean = cleanLine.replace(/(https?:\/\/[^\s]+)/gi, '<a href="$1" target="_blank" class="qr-scanned-link">$1</a>');
                    if(linkifiedClean.endsWith(';')) linkifiedClean = linkifiedClean.slice(0, -1).trim(); if(linkifiedClean.trim()) finalLines.push(linkifiedClean);
                }
            });
            if (!cardHeaderTitle) cardHeaderTitle = "Text";
            if (finalLines.length > 0) { resultHtml = finalLines.join('<br>'); return `<div style="font-size:1.05rem; color:#0284c7; font-weight:600; margin-bottom:12px; letter-spacing:0.5px;">${cardHeaderTitle}</div>` + resultHtml; }
            return data;
        }

        function saveScanToLocalStorageHistory(parsedContent, rawCleanText, imgSrc, fileName) {
            try {
                let historyData = localStorage.getItem('pextume_qr_history'); 
                let historyArray = historyData ? JSON.parse(historyData) : []; 
                let now = new Date();
                let dateStr = now.toLocaleDateString('en-US', { day: '2-digit', month: 'short', year: 'numeric' }); 
                let timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }); 
                let fullTimestamp = `${dateStr} at ${timeStr}`;
                
                let uniqueTokenTag = "<!-- id_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4) + " -->";
                let finalFormattedContent = (typeof parsedContent === 'string' ? parsedContent : "Scanned Content") + uniqueTokenTag;
                let uniqueForcedId = "id_" + Date.now() + "_" + Math.floor(Math.random() * 1000000);
                
                let cleanRaw = rawCleanText ? rawCleanText.split(' [Scan ID:')[0].trim() : "Scanned Data";
                let uniqueRawText = cleanRaw + " [Scan ID:" + Date.now() + "_" + Math.floor(Math.random() * 99999) + "]";

                historyArray.unshift({ 
                    id: uniqueForcedId, 
                    timestamp: fullTimestamp, 
                    content: finalFormattedContent, 
                    rawText: uniqueRawText, 
                    imgSrc: imgSrc || "", 
                    fileName: fileName || "Scanned QR Image" 
                });
                
                if(historyArray.length > 50) { historyArray.pop(); } 
                
                localStorage.setItem('pextume_qr_history', JSON.stringify(historyArray));
            } catch(err) {
                console.log("Storage error: ", err);
            }
        }

        function showScanResult(data, imgSrc, fileName) {
            rawDataForClipboard = data.trim(); 
            let displayData = parseContactQR(rawDataForClipboard);
            let finalImage = imgSrc || "";
            let finalFileName = fileName || "Scanned_QR.jpg";
            
            saveScanToLocalStorageHistory(displayData, rawDataForClipboard, finalImage, finalFileName); 
            renderMainDashboardResultPanel(displayData, finalImage, finalFileName);
        }

            document.getElementById('resultText').innerHTML = displayData;

        function handleResultAction() {
            if (!rawDataForClipboard) return;
            navigator.clipboard.writeText(rawDataForClipboard).then(() => {
                const actionBtn = document.getElementById('actionBtn');
                actionBtn.innerText = "✅ Copied Successfully!";
                setTimeout(() => { actionBtn.innerText = "📋 Copy Text to Clipboard"; }, 1500);
            }).catch(() => { alert("Failed to copy text. Please try manually."); });
        }

        function openHistoryModalBox() {
            let container = document.getElementById('historyListContainer'); container.innerHTML = ""; 
            let historyData = localStorage.getItem('pextume_qr_history'); let historyArray = historyData ? JSON.parse(historyData) : [];

                document.getElementById('clearHistoryBtn').style.display = 'block';
                historyArray.forEach(item => {
                    let card = document.createElement('div'); card.className = 'history-card';
                    card.innerHTML = `<div class="history-card-top-meta"><div class="history-card-date">📅 ${item.timestamp}</div><div class="history-three-dot-btn" onclick="toggleActionDropdownMenuBox(event, '${item.id}')">⋮</div><div class="history-action-dropdown-menu" id="dropdown-${item.id}"><div class="dropdown-menu-item" onclick="executeLiveHistoryView(event, '${item.id}')">👁️ View</div><div class="dropdown-menu-item" id="copy-btn-${item.id}">📋 Copy</div><div class="dropdown-menu-item item-delete" onclick="executeSingleHistoryItemDelete(event, '${item.id}')">🗑️ Delete</div></div></div><div class="history-card-body">${item.content}</div>`;
                    container.appendChild(card);
                    setTimeout(() => {
                        let btn = document.getElementById(`copy-btn-${item.id}`);
                        if(btn) { btn.addEventListener('click', function(e) { e.stopPropagation(); navigator.clipboard.writeText(item.rawText).then(() => { alert("Copied directly from history! 👍"); let allMenus = document.querySelectorAll('.history-action-dropdown-menu'); allMenus.forEach(m => m.style.display = 'none'); }); }); }
                    }, 10);
                });
            }
            document.getElementById('historyModalBox').style.display = 'flex';
        }

        function toggleActionDropdownMenuBox(event, itemId) { event.stopPropagation(); let targetMenu = document.getElementById(`dropdown-${itemId}`); let isAlreadyOpen = targetMenu.style.display === 'flex'; let allMenus = document.querySelectorAll('.history-action-dropdown-menu'); allMenus.forEach(m => m.style.display = 'none'); if (!isAlreadyOpen) { targetMenu.style.display = 'flex'; } }
        function closeHistoryModalBox() { document.getElementById('historyModalBox').style.display = 'none'; }
        
        function executeLiveHistoryView(event, itemId) { 
            event.stopPropagation(); 
            let historyData = localStorage.getItem('pextume_qr_history'); if(!historyData) return; 
            let historyArray = JSON.parse(historyData); 
            let targetItem = historyArray.find(item => item.id === itemId); 
            if(targetItem) { 
                closeHistoryModalBox(); 
                rawDataForClipboard = targetItem.rawText; 
                renderMainDashboardResultPanel(targetItem.content, targetItem.imgSrc, targetItem.fileName);

        function executeSingleHistoryItemDelete(event, itemId) { event.stopPropagation(); let historyData = localStorage.getItem('pextume_qr_history'); if(!historyData) return; let historyArray = JSON.parse(historyData); let updatedArray = historyArray.filter(item => item.id !== itemId); localStorage.setItem('pextume_qr_history', JSON.stringify(updatedArray)); openHistoryModalBox(); }
        function executeClearAllHistory() { if(confirm("🗑️ Are you sure you want to delete all scanned history items permanently?")) { localStorage.removeItem('pextume_qr_history'); openHistoryModalBox(); } }
