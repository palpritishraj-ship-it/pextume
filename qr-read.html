<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Camera Core Test</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            background: #ffffff;
            color: #000000;
        }
        #videoWrapper {
            width: 280px;
            height: 280px;
            margin: 20px auto;
            position: relative;
            background: #000;
            border: 3px solid #00d2a0;
            border-radius: 12px;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #btn {
            background: #00cc99;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        #result {
            margin-top: 30px;
            padding: 15px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            word-break: break-all;
        }
        .test-link {
            color: #0284c7 !important;
            text-decoration: underline !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>📷 QR Camera Core Test Only</h2>
    <p>This is a raw testing file with zero styles or extra logic.</p>

    <button id="btn" onclick="openCamera()">Start Camera</button>

    <div id="videoWrapper" style="display:none;">
        <video id="vid" autoplay muted playsinline></video>
    </div>

    <div id="result">Scanned link will appear here...</div>

    <!-- jsQR Core Library -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <script>
        let streamObj = null;
        let animId = null;

        async function openCamera() {
            document.getElementById('result').innerHTML = "Scanning...";
            try {
                streamObj = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                let video = document.getElementById('vid');
                video.srcObject = streamObj;
                document.getElementById('videoWrapper').style.display = 'block';
                document.getElementById('btn').style.display = 'none';
                
                animId = requestAnimationFrame(trackFrame);
            } catch (err) {
                alert("Camera error: " + err);
            }
        }

        function trackFrame() {
            let video = document.getElementById('vid');
            if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
                let canvas = document.createElement("canvas");
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                let ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // 👑 টাইপিং এরর বাগ একদম ফিক্সড ভাই (imgData পারফেক্টলি সেট)
                let code = jsQR(imgData.data, imgData.width, imgData.height);
                
                if (code && code.data) {
                    let text = code.data.trim();
                    
                    if (animId) cancelAnimationFrame(animId);
                    if (streamObj) streamObj.getTracks().forEach(t => t.stop());
                    
                    document.getElementById('videoWrapper').style.display = 'none';
                    document.getElementById('btn').style.display = 'block';
                    
                    if (text.startsWith("http://") || text.startsWith("https://")) {
    document.getElementById('result').innerHTML = `
        <div style="font-size:18px;font-weight:bold;margin-bottom:10px;">
            ✅ QR Code Detected
        </div>

        <a href="${text}" class="test-link">
            🔗 Open Link
        </a>

        <div style="margin-top:10px;font-size:13px;color:#666;word-break:break-all;">
            ${text}
        </div>
    `;
} else {
    document.getElementById('result').innerHTML = `
        <div style="font-size:18px;font-weight:bold;">📄 Text Found</div>
        <div style="margin-top:10px;">${text}</div>
    `;
}
                    return;
                }
            }
            animId = requestAnimationFrame(trackFrame);
        }
    </script>
</body>
</html>
