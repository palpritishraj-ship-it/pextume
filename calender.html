<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>স্মার্ট ₹৭০ সেভিংস ট্র্যাকার</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-sub: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #10b981;
            --primary-dark: #059669;
            --accent: #3b82f6;
            --coin-bg: #ffffff;
            --coin-border: #cbd5e1;
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --bg-body: #090d16;
            --bg-card: #111827;
            --bg-sub: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #10b981;
            --primary-dark: #047857;
            --accent: #60a5fa;
            --coin-bg: #1e293b;
            --coin-border: #475569;
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 12px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .app-container {
            width: 100%;
            max-width: 540px;
            background: var(--bg-card);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 20px;
            border: 1px solid var(--border-color);
            height: fit-content;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .app-title h1 {
            font-size: 1.35rem;
            font-weight: 700;
        }

        .app-title p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .theme-btn {
            background: var(--bg-sub);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .dashboard {
            background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
            border-radius: 20px;
            padding: 18px;
            color: #ffffff;
            margin-bottom: 18px;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
        }

        .dash-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            text-align: center;
            margin-bottom: 14px;
        }

        .dash-item {
            background: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(6px);
            padding: 12px 8px;
            border-radius: 14px;
        }

        .dash-item span {
            display: block;
            font-size: 0.82rem;
            opacity: 0.92;
        }

        .dash-item strong {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .progress-wrapper {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-fill {
            background: #fde047;
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            opacity: 0.95;
        }

        .quick-today-btn {
            width: 100%;
            background: var(--bg-sub);
            border: 1.5px dashed var(--primary);
            color: var(--primary);
            padding: 10px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 16px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .quick-today-btn:active {
            transform: scale(0.98);
            background: rgba(16, 185, 129, 0.1);
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-sub);
            padding: 8px 12px;
            border-radius: 14px;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
        }

        .nav-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .month-nav h2 {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day-card {
            background: var(--bg-sub);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 6px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s ease;
        }

        .day-card.empty {
            background: transparent;
            border: none;
        }

        .day-card.today {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .day-card.completed {
            border-color: var(--primary);
            background: rgba(16, 185, 129, 0.08);
        }

        .date-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            margin-bottom: 5px;
        }

        .date-num {
            font-size: 0.88rem;
            font-weight: 700;
        }

        .check-badge {
            font-size: 0.7rem;
            color: var(--primary);
        }

        .coins {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            width: 100%;
        }

        .coin-btn {
            background: var(--coin-bg);
            border: 1px solid var(--coin-border);
            border-radius: 7px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-main);
            padding: 4px 0;
            cursor: pointer;
            text-align: center;
            user-select: none;
            transition: transform 0.12s, background 0.2s;
        }

        .coin-btn:active {
            transform: scale(0.88);
        }

        .coin-btn.checked {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary-dark);
            text-decoration: line-through;
            box-shadow: 0 2px 5px rgba(16, 185, 129, 0.3);
        }

        .day-total {
            margin-top: 5px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .day-card.completed .day-total {
            color: var(--primary);
        }

        .bottom-reset {
            margin-top: 18px;
            text-align: center;
        }

        .reset-btn {
            background: transparent;
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            padding: 7px 16px;
            border-radius: 10px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 440px) {
            .app-container {
                padding: 14px 10px;
                border-radius: 18px;
            }
            .calendar-grid {
                gap: 4px;
            }
            .coin-btn {
                font-size: 0.68rem;
                padding: 3px 0;
            }
            .dash-item strong {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-bar">
        <div class="app-title">
            <h1>💎 ₹৭০ সেভিংস ট্র্যাকার</h1>
            <p>১০ + ১০ + ২০ + ৩০ = প্রতিদিন ₹৭০</p>
        </div>
        <button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="থিম পরিবর্তন">🌙</button>
    </div>

    <div class="dashboard">
        <div class="dash-grid">
            <div class="dash-item">
                <span>এই মাসের মোট জমা</span>
                <strong id="monthTotal">₹০</strong>
            </div>
            <div class="dash-item">
                <span>পূর্ণ দিন (₹৭০)</span>
                <strong id="fullDaysCount">০ দিন</strong>
            </div>
        </div>
        <div class="progress-wrapper">
            <div class="progress-fill" id="progressBar"></div>
        </div>
        <div class="progress-info">
            <span id="progressText">মাসিক অগ্রগতি: ০%</span>
            <span id="monthTargetText">মাসিক লক্ষ্য: ₹২,১০০</span>
        </div>
    </div>

    <button class="quick-today-btn" onclick="markTodayFull()">
        ⚡ আজকের পুরো ₹৭০ জমা মার্ক করুন
    </button>

    <div class="month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">◀ আগের মাস</button>
        <h2 id="monthYearDisplay"></h2>
        <button class="nav-btn" onclick="changeMonth(1)">পরের মাস ▶</button>
    </div>

    <div class="weekdays">
        <div>রবি</div>
        <div>সোম</div>
        <div>মঙ্গল</div>
        <div>বুধ</div>
        <div>বৃহঃ</div>
        <div>শুক্র</div>
        <div>শনি</div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="bottom-reset">
        <button class="reset-btn" onclick="resetCurrentMonth()"> এই মাস রিসেট করুন</button>
    </div>
</div>
<script>
    const denominations = [10, 10, 20, 30];
    const monthNames = [
        "জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন",
        "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"
    ];

    let currentDate = new Date();
    let currentYear = currentDate.getFullYear();
    let currentMonth = currentDate.getMonth();

    let savingsData = JSON.parse(localStorage.getItem('daily70SavingsV2')) || {};
    let currentTheme = localStorage.getItem('savingsTheme') || 'light';

    if (currentTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('themeToggle').innerText = '☀️';
    }

    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
            document.documentElement.removeAttribute('data-theme');
            document.getElementById('themeToggle').innerText = '🌙';
            localStorage.setItem('savingsTheme', 'light');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('themeToggle').innerText = '☀️';
            localStorage.setItem('savingsTheme', 'dark');
        }
    }

    function toBengaliNumber(num) {
        const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return num.toString().replace(/\d/g, d => bengaliDigits[d]);
    }

    function saveData() {
        localStorage.setItem('daily70SavingsV2', JSON.stringify(savingsData));
        updateStats();
    }

    function toggleCoin(dateKey, index) {
        if (!savingsData[dateKey]) {
            savingsData[dateKey] = [false, false, false, false];
        }
        savingsData[dateKey][index] = !savingsData[dateKey][index];
        saveData();
        renderCalendar();
    }

    function markTodayFull() {
        const today = new Date();
        const dateKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        savingsData[dateKey] = [true, true, true, true];
        currentYear = today.getFullYear();
        currentMonth = today.getMonth();
        saveData();
        renderCalendar();
    }

    function updateStats() {
        let monthSum = 0;
        let fullDays = 0;

        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const monthTarget = daysInMonth * 70;
        const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;

        for (const [key, checks] of Object.entries(savingsData)) {
            if (key.startsWith(monthPrefix)) {
                let daySum = 0;
                checks.forEach((isChecked, idx) => {
                    if (isChecked) daySum += denominations[idx];
                });
                monthSum += daySum;
                if (daySum === 70) fullDays++;
            }
        }

        const percentage = Math.min(100, Math.round((monthSum / monthTarget) * 100));

        document.getElementById('monthTotal').innerText = `₹${toBengaliNumber(monthSum)}`;
        document.getElementById('fullDaysCount').innerText = `${toBengaliNumber(fullDays)} দিন`;
        document.getElementById('progressBar').style.width = `${percentage}%`;
        document.getElementById('progressText').innerText = `মাসিক অগ্রগতি: ${toBengaliNumber(percentage)}%`;
        document.getElementById('monthTargetText').innerText = `মাসিক লক্ষ্য: ₹${toBengaliNumber(monthTarget)}`;
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        document.getElementById('monthYearDisplay').innerText =
            `${monthNames[currentMonth]} ${toBengaliNumber(currentYear)}`;

        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

        const today = new Date();
        const isCurrentMonthYear = today.getFullYear() === currentYear && today.getMonth() === currentMonth;

        for (let i = 0; i < firstDay; i++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'day-card empty';
            grid.appendChild(emptyDiv);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const checks = savingsData[dateKey] || [false, false, false, false];

            let dayTotal = 0;
            checks.forEach((c, i) => { if (c) dayTotal += denominations[i]; });

            const card = document.createElement('div');
            card.className = 'day-card';
            if (isCurrentMonthYear && day === today.getDate()) {
                card.classList.add('today');
            }
            if (dayTotal === 70) {
                card.classList.add('completed');
            }

            const dateHeader = document.createElement('div');
            dateHeader.className = 'date-header';

            const dateLabel = document.createElement('span');
            dateLabel.className = 'date-num';
            dateLabel.innerText = toBengaliNumber(day);
            dateHeader.appendChild(dateLabel);

            if (dayTotal === 70) {
                const badge = document.createElement('span');
                badge.className = 'check-badge';
                badge.innerText = '✔';
                dateHeader.appendChild(badge);
            }

            card.appendChild(dateHeader);

            const coinsDiv = document.createElement('div');
            coinsDiv.className = 'coins';

            denominations.forEach((val, idx) => {
                const btn = document.createElement('div');
                btn.className = 'coin-btn' + (checks[idx] ? ' checked' : '');
                btn.innerText = toBengaliNumber(val);
                btn.onclick = () => toggleCoin(dateKey, idx);
                coinsDiv.appendChild(btn);
            });

            card.appendChild(coinsDiv);

            const totalLabel = document.createElement('div');
            totalLabel.className = 'day-total';
            totalLabel.innerText = `₹${toBengaliNumber(dayTotal)}`;
            card.appendChild(totalLabel);

            grid.appendChild(card);
        }

        updateStats();
    }

    function changeMonth(step) {
        currentMonth += step;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        } else if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        renderCalendar();
    }

    function resetCurrentMonth() {
        if (confirm("আপনি কি এই মাসের পুরো হিসাব মুছে ফেলতে চান তাহলে OK চাপুন।")) {
            const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
            for (const key of Object.keys(savingsData)) {
                if (key.startsWith(monthPrefix)) {
                    delete savingsData[key];
                }
            }
            saveData();
            renderCalendar();
        }
    }

    renderCalendar();
</script>

</body>
</html>
